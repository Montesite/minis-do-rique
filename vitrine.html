<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstração de Vitrine – Minis do Rique</title>
  <meta name="description" content="Vitrine online Minis do Rique – confira nosso catálogo completo de miniaturas diecast raras e expositores.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --preto:    #080808;
      --preto-mid:#111111;
      --amarelo:  #FFD000;
      --laranja:  #F5820A;
      --branco:   #FFFFFF;
      --cinza:    #888888;
    }

    /* Trava scroll total */
    html, body {
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    /* Esconde scrollbars */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body { font-family: 'Inter', sans-serif; background: var(--preto); }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ── HEADER ── */
    :root { --header-h: 80px; }

    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      z-index: 1000;
      background: rgba(8, 8, 8, 0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 2px 0 rgba(255,208,0,0.18);
    }

    .header-inner {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo-img { height: 58px; width: auto; }

    nav.main-nav {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    nav.main-nav a {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      transition: color 0.3s;
      position: relative;
    }
    nav.main-nav a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 2px;
      background: var(--amarelo);
      transition: width 0.3s ease;
    }
    nav.main-nav a:hover { color: var(--amarelo); }
    nav.main-nav a:hover::after { width: 100%; }

    .btn-nav-wa {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: var(--amarelo);
      color: var(--preto);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 2px solid var(--amarelo);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }
    .btn-nav-wa:hover { background: var(--laranja); border-color: var(--laranja); color: var(--branco); }
    .btn-nav-wa svg { width: 14px; height: 14px; }

    .btn-nav-vitrine {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border: 1.5px solid rgba(255,208,0,0.4);
      color: var(--amarelo);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.3s, background 0.3s;
    }
    .btn-nav-vitrine:hover { border-color: var(--amarelo); background: rgba(255,208,0,0.08); }
    .btn-nav-vitrine svg { width: 13px; height: 13px; }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 26px; height: 2px;
      background: var(--branco);
      transition: 0.35s ease;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-nav {
      display: none;
      position: fixed;
      top: var(--header-h); left: 0; right: 0;
      background: #111111;
      border-top: 2px solid var(--amarelo);
      padding: 20px 28px 28px;
      flex-direction: column;
      gap: 0;
      z-index: 900;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: color 0.3s;
    }
    .mobile-nav a:last-of-type { border-bottom: none; }
    .mobile-nav a:hover { color: var(--amarelo); }
    .mobile-nav .mob-wa {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      background: var(--amarelo);
      color: var(--preto);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: background 0.3s;
    }
    .mobile-nav .mob-wa:hover { background: var(--laranja); color: var(--branco); }

    /* ── IFRAME container ── */
    #iframe-container {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      width: 100%;
      /* altura via JS */
    }

    #vitrine-iframe {
      width: 100%;
      border: none;
      display: block;
    }

    /* ── BADGE inferior 63px ── */
    #vitrine-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 63px;
      z-index: 100;
      background: #050505;
      border-top: 1px solid rgba(255,208,0,0.14);
      display: flex;
      align-items: center;
    }

    .bottom-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .bottom-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bottom-logo  { height: 30px; width: auto; }
    .bottom-slogan {
      font-size: 0.76rem;
      font-weight: 300;
      color: rgba(255,255,255,0.3);
      white-space: nowrap;
    }

    .bottom-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .bottom-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      transition: color 0.3s;
      white-space: nowrap;
    }
    .bottom-link:hover { color: var(--amarelo); }
    .bottom-link svg { width: 15px; height: 15px; }

    /* ── Responsivo ── */
    @media (max-width: 900px) {
      nav.main-nav, .btn-nav-wa, .btn-nav-vitrine { display: none; }
      .hamburger { display: flex; }
    }
    @media (max-width: 768px) {
      .logo-img { height: 46px; }
      .bottom-slogan { display: none; }
    }
    @media (max-width: 480px) {
      .bottom-link .link-label { display: none; }
    }
  </style>
</head>

  <script>
    // Hamburger
    const hamburger = document.getElementById('hamburger');
    const mobileNav = document.getElementById('mobileNav');
    hamburger.addEventListener('click', () => {
      const open = hamburger.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', String(open));
      mobileNav.classList.toggle('open', open);
    });

    function updateLayout() {
      var HEADER_H = document.getElementById('header').offsetHeight;
      var BADGE_H  = 63;
      var iframeH  = window.innerHeight - HEADER_H - BADGE_H;
      var container = document.getElementById('iframe-container');
      var iframe    = document.getElementById('vitrine-iframe');
      container.style.top    = HEADER_H + 'px';
      container.style.height = iframeH + 'px';
      iframe.style.height    = iframeH + 'px';
    }
    window.addEventListener('resize', updateLayout);
    updateLayout();
  </script>
